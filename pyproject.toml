[tool.poetry]
name = "wilhelmina"
version = "0.4.0"
description = "API client for Wilma school portal"
authors = ["Frank Wickström <frwickst@gmail.com>"]
repository = "https://github.com/frwickst/pywilma"
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.14"
aiohttp = "^3.11.16"
mashumaro = "^3.15"
html2text = ">=2025.4.15"
beautifulsoup4 = "^4.13.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.4.1"
pytest-cov = "^7.1.0"
pytest-socket = "^0.8.1"
pytest-sugar = "^1.1.1"
mypy = "^2.4.1"
ruff = "^0.17.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["wilhelmina"]
lint.select = ["E4", "E7", "E9", "F", "G", "T20", "TRY004", "TRY203", "TRY400", "B", "ERA", "PIE", "I"]
lint.ignore = ["E203", "E501", "B007", "B026", "B904", "PIE808"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "wilhelmina.tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
show_missing = true
fail_under = 95
